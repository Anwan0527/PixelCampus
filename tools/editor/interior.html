<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素校园 · 室内编辑器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #1d2220; --panel: #262c29; --line: #3a423e; --fg: #e8eadf; --dim: #9aa39a; --acc: #f0c040; --red: #e0564a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 220px 1fr 300px; grid-template-rows: 44px minmax(0, 1fr) 26px; height: 100%; min-height: 0; }
  #top { grid-column: 1 / 4; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .sp { flex: 1; }
  #tools { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 6px 4px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  #tools button { flex: 0 0 auto; }
  #tools button { width: 100%; padding: 6px 0; font-size: 12px; line-height: 1.2; }
  #tools button small { display: block; color: var(--dim); font-size: 10px; }
  #tools button.on small { color: #4a3a00; }
  #stage { position: relative; overflow: hidden; background: #111; min-height: 0; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 8px; min-height: 0; }
  #bar { grid-column: 1 / 4; display: flex; gap: 16px; align-items: center; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; }
  button, select, input { font: inherit; color: var(--fg); background: #343c38; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; } button:hover { background: #404a45; } button.on { background: var(--acc); color: #2a2200; border-color: var(--acc); }
  button:disabled { opacity: .45; cursor: default; }
  button.pri { background: #3f7f3a; border-color: #5aa850; } button.warn { background: #7a3a34; border-color: #a85048; }
  h4 { margin: 12px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .5px; }
  h4:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border: 2px solid transparent; border-radius: 4px; background: #2e3531; cursor: pointer; font-size: 11px; text-align: center; min-height: 52px; justify-content: flex-start; }
  .sw.on { border-color: var(--acc); background: #3a3f30; }
  .sw i { width: 28px; height: 22px; border: 1px solid #000a; border-radius: 2px; display: block; } .sw canvas { position: static; width: 32px; height: 32px; image-rendering: pixelated; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; } .row label { color: var(--dim); min-width: 52px; } .row input[type=number] { width: 70px; } .row select { flex: 1; }
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #000c; padding: 6px 14px; border-radius: 6px; display: none; z-index: 5; max-width: 70%; }
  #help { position: absolute; left: 10px; bottom: 10px; background: #000a; padding: 6px 10px; border-radius: 6px; color: var(--dim); font-size: 12px; max-width: 60%; pointer-events: none; }
  #sel { background: #2e3531; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
  kbd { background: #343c38; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
  /* 窗口不高时工具栏收紧（放在最后，才压得过上面的按钮样式）；再矮就出滚动条，工具栏永远能滚到每一个工具 */
  @media (max-height: 760px) { #tools { gap: 2px; padding: 4px 3px; } #tools button { padding: 3px 0; font-size: 11px; } #tools button small { display: none; } }
</style>
<style>
  #tools { align-items: stretch; padding: 8px; gap: 6px; flex-direction: column; }
  #tools .tb { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; } #tools .tb button { padding: 5px 0; }
  #palette { overflow-y: auto; min-height: 0; flex: 1; }
  #palette .grid { grid-template-columns: repeat(2, 1fr); }
  .sw .nm { line-height: 1.15; }
  textarea { font: inherit; color: var(--fg); background: #343c38; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; width: 100%; min-height: 70px; resize: vertical; }
  .item { display: flex; gap: 4px; align-items: center; margin: 3px 0; flex-wrap: wrap; } .item input[type=text] { flex: 1; min-width: 60px; } .item input[type=number] { width: 56px; }
  a { color: var(--acc); text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <b>像素校园 · 室内编辑器</b>
    <a href="/" title="回到地图编辑器">← 地图编辑器</a>
    <select id="which" title="选一间室内"></select>
    <button id="newroom" title="新建一间室内">新建</button><button id="dup" title="复制当前这间">复制</button>
    <button id="undo" title="撤销 Ctrl+Z">↶ 撤销</button><button id="redo" title="重做 Ctrl+Shift+Z">↷ 重做</button>
    <span class="sp"></span>
    <span id="dirty" style="color:var(--dim)"></span>
    <button id="save" class="pri" title="保存到 data/interiors/&lt;id&gt;.json（Ctrl+S）">保存</button>
    <button id="build" title="保存，并重新生成室内的画面（几秒）">保存并生成预览</button>
    <button id="buildworld" title="重新生成整张地图（约 10~20 秒）：改了「开放入口」或建筑的室内设置后要点它，门口才会出现「进入」">生成地图（让入口生效）</button>
  </div>
  <div id="tools">
    <div class="tb" id="tb"></div>
    <div id="palette"></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="help"></div></div>
  <div id="side"></div>
  <div id="bar"><span id="pos"></span><span id="zoomv"></span><span id="status"></span></div>
</div>
<script type="module" src="/interior.js"></script>
</body>
</html>
